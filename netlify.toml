# Netlify build configuration for tristianwalker.com
# This file lets Netlify build the Vite app correctly with no UI tweaking.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: route every unmatched URL to index.html so React Router works.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache the hashed asset bundles Vite emits (filenames change per build).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache the HTML shell — always fetch fresh so new deploys take effect.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
